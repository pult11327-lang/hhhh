name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unpack Project ZIP
      run: |
        unzip "ДРАГ ИСП.zip" -d project_extracted
        TARGET_DIR=$(find project_extracted -name "gradlew" -exec dirname {} \+ | head -n 1)
        if [ -n "$TARGET_DIR" ]; then
          echo "Проект найден в папке: $TARGET_DIR"
          mv "$TARGET_DIR"/* .
          find "$TARGET_DIR" -maxdepth 1 -name ".*" -not -name "." -not -name ".." -exec mv {} . \;
        else
          echo "Внимание: gradlew не найден напрямую, пробуем перенести всё из project_extracted"
          mv project_extracted/* .
        fi

    - name: Fix Missing AlertDialog Import
      run: |
        FILE_PATH="app/src/main/java/com/example/dragauto/MainActivity.kt"
        if [ -f "$FILE_PATH" ]; then
          echo "Исправляем импорт в MainActivity.kt"
          sed -i '/package com.example.dragauto/a import androidx.appcompat.app.AlertDialog' "$FILE_PATH"
        fi

    - name: Fix Ambiguity in DragAccessibilityService
      run: |
        SERVICE_PATH="app/src/main/java/com/example/dragauto/DragAccessibilityService.kt"
        if [ -f "$SERVICE_PATH" ]; then
          echo "Исправляем неоднозначность типов в DragAccessibilityService.kt"
          # Явно приводим элементы сложения к строке с помощью .toString(), чтобы убрать ошибку компиляции
          sed -i '54s/\+/.toString() +/' "$SERVICE_PATH" || true
        fi

    - name: Make Gradle executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
