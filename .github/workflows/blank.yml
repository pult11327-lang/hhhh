name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unpack Project ZIP
      run: |
        unzip "ДРАГ ИСП.zip" -d project_extracted
        if [ -d "project_extracted/DragAuto_GitHub_Actions_READY" ]; then
          mv project_extracted/DragAuto_GitHub_Actions_READY/* .
        elif [ -d "project_extracted/dragauto" ]; then
          mv project_extracted/dragauto/* .
        else
          mv project_extracted/* .
        fi
        
    - name: Make Gradle executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
